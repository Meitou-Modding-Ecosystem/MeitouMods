# Builds every mod against the pinned engine and runs the mods' tests, on PRs to beta and main and on pushes to them.
name: CI

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build
